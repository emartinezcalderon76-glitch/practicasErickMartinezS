<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        let name = (prompt("Escribe tu nombre:"));
        let n1, n2;

        n1 = Number(prompt("Escribe tu primer numero:"));
        n2 = Number(prompt("Escribe tu segundo numero:"));
resulsuma=n1+n2
document.write("<h1>Hola " + name + "</h1>");
document.write("<h1>El resultado de tu suma es : " + resulsuma + "</h1>");

resultresta=n1-n2
document.write("<h1>El resultado de tu resta es : " + resultresta + "</h1>");

resultmulti=n1*n2
document.write("<h1>El resultado de tu multiplicacion es : " + resultmulti + "</h1>");

resultdiv=n1/n2
document.write("<h1>El resultado de tu division es : " + resultdiv + "</h1>");

residuodiv=n1%n2
document.write("<h1>El residuo de tu division es : " + residuodiv + "</h1>");

    </script>
</body>
</html>
